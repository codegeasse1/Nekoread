name: Build Debug APK

# Automatically builds the app on every push to `main` and makes the APK
# downloadable from the `build` branch + the Actions artifacts.
# On failure, the Gradle log is pushed to the build branch as build-error.log
# so the failure is visible without Actions access.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install core packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || vars.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$PWD/my-upload-key.jks" >> "$GITHUB_ENV"
            if [ -z "$STORE_PASSWORD" ]; then
              echo "::error::KEYSTORE_BASE64 is set but STORE_PASSWORD is missing. Add the STORE_PASSWORD secret (and KEY_PASSWORD if it differs)."
              exit 1
            fi
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "::notice::Debug APK will be signed with the real keystore from secrets (stable signature, installs in-place)."
          else
            # No real key configured yet — fall back to a throwaway debug key.
            if [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Nekoread,C=US" > /dev/null 2>&1
            fi
            echo "::warning::No KEYSTORE_BASE64 secret configured — using a throwaway debug key."
          fi

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --info --stacktrace > gradle-build.log 2>&1
          EXIT=$?
          set -e
          echo "=== compose/compiler classpath ==="
          grep -nE "kotlin-compose-compiler-plugin|kotlin-compiler-embeddable|Xplugin=|pluginClasspath|getPluginId|KotlinVersion|ComposePluginRegistrar" gradle-build.log | head -50 || true
          echo "=== compile errors (e: lines) ==="
          grep -n "e: " gradle-build.log | head -80 || true
          echo "=== build log tail ==="
          tail -n 40 gradle-build.log
          exit $EXIT

      - name: Upload APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nekoread-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Push result to the build branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the APK and log around for later, then remove working-tree
          # files that would collide with whatever the build branch tracks.
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/nekoread-debug.apk 2>/dev/null || true
          cp gradle-build.log /tmp/nekoread-build.log 2>/dev/null || true
          rm -f gradle-build.log build-error.log Nekoread-debug.apk

          git fetch origin build || true
          if git rev-parse --verify origin/build > /dev/null 2>&1; then
            git switch build
          else
            git switch --orphan build
          fi
          git rm -rf --quiet . || true

          if [ -f /tmp/nekoread-debug.apk ]; then
            cp /tmp/nekoread-debug.apk Nekoread-debug.apk
          else
            cp /tmp/nekoread-build.log build-error.log 2>/dev/null || true
          fi

          cat > README.md <<'EOF'
          # Nekoread — automatic builds

          This branch holds APK files produced by GitHub Actions. Install by downloading
          the `.apk` onto your Android device and opening it (allow "install from unknown sources").

          - `Nekoread-debug.apk` — latest debug build from `main`. Auto-updated on every push.
          - `build-error.log` — present when the latest build failed (contains the Gradle error).

          Latest release APKs (if any) appear here too, but the official release downloads
          are on the Releases page: https://github.com/codegeasse1/Nekoread/releases

          If the repo has the real signing key configured (KEYSTORE_BASE64 + STORE_PASSWORD +
          KEY_PASSWORD secrets), the debug APK is signed with that stable key and updates install
          in-place. Without them it's signed with a throwaway debug key (reinstall to update).
          EOF

          # Only the three files below belong on this branch; never commit build junk.
          if [ -f Nekoread-debug.apk ]; then git add Nekoread-debug.apk; fi
          if [ -f build-error.log ]; then git add build-error.log; fi
          git add README.md
          git commit -m "build result for ${{ github.sha }} (${{ job.status }})" --allow-empty
          git push --force origin build
