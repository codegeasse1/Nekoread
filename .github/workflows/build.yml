name: Build Debug APK

# Automatically builds the app on every push to `main` and makes the APK
# downloadable from the `build` branch + the Actions artifacts.
# On failure, the Gradle log is pushed to the build branch as build-error.log
# so the failure is visible without Actions access.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install core packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Nekoread,C=US" > /dev/null 2>&1
          fi

      - name: Build debug APK
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --info --stacktrace > gradle-build.log 2>&1
          EXIT=$?
          set -e
          echo "=== compose/compiler classpath ==="
          grep -nE "kotlin-compose-compiler-plugin|kotlin-compiler-embeddable|Xplugin=|pluginClasspath|getPluginId|KotlinVersion|ComposePluginRegistrar" gradle-build.log | head -50 || true
          echo "=== compile errors (e: lines) ==="
          grep -n "e: " gradle-build.log | head -80 || true
          echo "=== build log tail ==="
          tail -n 40 gradle-build.log
          exit $EXIT

      - name: Upload APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nekoread-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Push result to the build branch
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the log around for the failure case, then remove working-tree
          # files that would collide with whatever the build branch tracks.
          cp gradle-build.log /tmp/nekoread-build.log 2>/dev/null || true
          rm -f gradle-build.log build-error.log Nekoread-debug.apk

          git fetch origin build || true
          if git rev-parse --verify origin/build > /dev/null 2>&1; then
            git switch build
          else
            git switch --orphan build
          fi
          git rm -rf --quiet . || true

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Nekoread-debug.apk
          else
            cp /tmp/nekoread-build.log build-error.log 2>/dev/null || true
          fi

          cat > README.md <<'EOF'
          # Nekoread — automatic builds

          This branch holds APK files produced by GitHub Actions. Install by downloading
          the `.apk` onto your Android device and opening it (allow "install from unknown sources").

          - `Nekoread-debug.apk` — latest debug build from `main`. Auto-updated on every push.
          - `build-error.log` — present when the latest build failed (contains the Gradle error).

          Latest release APKs (if any) appear here too, but the official release downloads
          are on the Releases page: https://github.com/codegeasse1/Nekoread/releases

          The debug APK is signed with a throwaway debug key. If you want a release you can
          actually update in-place, use a proper release from the Releases page (built with
          the real signing key).
          EOF

          # Only the three files below belong on this branch; never commit build junk.
          git add Nekoread-debug.apk build-error.log README.md
          git commit -m "build result for ${{ github.sha }} (${{ job.status }})" --allow-empty
          git push --force origin build
