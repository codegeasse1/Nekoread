name: Attach Debug APK to Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the debug APK to"
        required: true
        type: string
        default: "v2.0"

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch (holds the built APK)
        uses: actions/checkout@v4
        with:
          ref: build

      - name: Attach debug APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" Nekoread-debug.apk --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
